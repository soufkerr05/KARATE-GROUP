<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>نظام تدريب الكاراتيه الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --color-bg:#F4F6FA;
    --color-surface:#FFFFFF;
    --color-primary:#1B4F91;      /* أزرق البساط */
    --color-primary-dark:#123866;
    --color-secondary:#C1272D;    /* أحمر البساط */
    --color-secondary-light:#E2726B;
    --color-text:#1B2430;
    --color-muted:#64707D;
    --color-border:#E3E8F0;
    --color-gold:#E3A73C;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-full:999px;
    --shadow-soft:0 10px 30px rgba(27,79,145,.12);
    --ease:cubic-bezier(.4,.0,.2,1);
  }
  body.dark-mode{
    --color-bg:#111827;
    --color-surface:#1F2937;
    --color-primary-dark:#D7E7FF;
    --color-text:#F3F4F6;
    --color-muted:#AAB5C4;
    --color-border:#374151;
    --shadow-soft:0 10px 30px rgba(0,0,0,.28);
  }
  body.dark-mode .topbar{background:rgba(17,24,39,.82);}
  body.dark-mode .field input,
  body.dark-mode .field select,
  body.dark-mode .field textarea,
  body.dark-mode .search-wrapper input,
  body.dark-mode .rate-select{background:#111827;color:var(--color-text);}
  body.dark-mode .btn-ghost{background:#273449;color:var(--color-primary-dark);}
  body.dark-mode .btn-ghost:hover{background:#334155;}
  body.dark-mode .t-card,
  body.dark-mode .pill,
  body.dark-mode .session-date{background:#273449;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal',sans-serif;
    background:var(--color-bg);
    color:var(--color-text);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand,.nav-label,.stat-value{font-family:'Cairo',sans-serif;}
  button{font-family:inherit;}
  ::selection{background:var(--color-primary);color:#fff;}

  /* ===== Layout ===== */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:104px;flex-shrink:0;
    background:linear-gradient(200deg,var(--color-primary) 0%, var(--color-secondary) 100%);
    display:flex;flex-direction:column;align-items:center;
    padding:26px 0;gap:10px;
    position:sticky;top:0;height:100vh;
    z-index:40;
  }
  .brand{
    width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;margin-bottom:18px;
    color:#fff;font-weight:800;font-size:20px;border:2px solid rgba(255,255,255,.35);
  }
  .nav-btn{
    width:60px;display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:8px 0;background:transparent;border:none;cursor:pointer;color:rgba(255,255,255,.85);
  }
  .nav-circle{
    width:52px;height:52px;border-radius:50%;
    background:rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;
    transition:transform .25s var(--ease), background .25s var(--ease), box-shadow .25s var(--ease);
  }
  .nav-circle svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s var(--ease);}
  .nav-btn:hover .nav-circle{background:rgba(255,255,255,.26);transform:translateY(-2px);}
  .nav-btn.active .nav-circle{background:#fff;box-shadow:0 8px 18px rgba(0,0,0,.18);}
  .nav-btn.active .nav-circle svg{stroke:var(--color-primary);}
  .nav-label{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.9);}
  .nav-btn.active .nav-label{color:#fff;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 32px;background:rgba(255,255,255,.75);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--color-border);position:sticky;top:0;z-index:30;
    flex-wrap:wrap;gap:12px;
  }
  .topbar h1{margin:0;font-size:22px;color:var(--color-primary-dark);}
  .topbar .sub{margin:2px 0 0;color:var(--color-muted);font-size:13.5px;}
  .season-chip{
    display:flex;align-items:center;gap:10px;background:var(--color-surface);
    border:1px solid var(--color-border);padding:8px 16px;border-radius:var(--radius-full);
    font-weight:700;color:var(--color-primary-dark);font-size:14px;box-shadow:var(--shadow-soft);
  }
  .season-dot{width:10px;height:10px;border-radius:50%;background:var(--color-secondary);}

  #content{padding:30px 32px 70px;max-width:1180px;margin:0 auto;width:100%;}
  .view{display:none;}
  .view.active{display:block;animation:fadeSlide .45s var(--ease);}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .view-head{margin-bottom:22px;}
  .view-head h2{margin:0 0 4px;font-size:24px;color:var(--color-primary-dark);}
  .view-head p{margin:0;color:var(--color-muted);font-size:14.5px;}

  /* ===== Cards / Grids ===== */
  .grid{display:grid;gap:20px;}
  .stats-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:26px;}
  .two-col{grid-template-columns:1.3fr 1fr;}
  @media (max-width:900px){.two-col{grid-template-columns:1fr;}}

  .card{
    background:var(--color-surface);border-radius:var(--radius-lg);
    padding:22px;border:1px solid var(--color-border);
    transition:transform .25s var(--ease), box-shadow .25s var(--ease);
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-soft);}

  .stat-card{display:flex;align-items:center;gap:16px;}
  .stat-icon{
    width:52px;height:52px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .stat-icon svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .stat-label{color:var(--color-muted);font-size:13px;margin:0 0 4px;}
  .stat-value{font-size:22px;margin:0;color:var(--color-text);}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px;flex-wrap:wrap;gap:8px;}
  .section-title h3{margin:0;font-size:17px;color:var(--color-primary-dark);}

  /* ===== Progress Ring ===== */
  .ring-wrap{display:flex;align-items:center;gap:18px;}
  .ring-value{font-size:26px;font-weight:800;color:var(--color-primary-dark);font-family:'Cairo',sans-serif;}
  .ring-caption{color:var(--color-muted);font-size:13px;}

  /* ===== Buttons ===== */
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    border:none;cursor:pointer;border-radius:var(--radius-full);
    padding:11px 22px;font-weight:700;font-size:14.5px;
    transition:transform .2s var(--ease), box-shadow .2s var(--ease), opacity .2s var(--ease);
  }
  .btn-primary{background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));color:#fff;box-shadow:0 8px 20px rgba(27,79,145,.28);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(27,79,145,.36);}
  .btn-ghost{background:var(--color-bg);color:var(--color-primary-dark);border:1px solid var(--color-border);}
  .btn-ghost:hover{background:#eaf0fa;}
  .btn-sm{padding:8px 16px;font-size:13px;}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .theme-toggle{margin-top:auto;}
  .theme-toggle .nav-label{white-space:nowrap;}

  /* ===== Timeline (events) ===== */
  .timeline{position:relative;padding-inline-start:26px;}
  .timeline::before{content:"";position:absolute;top:4px;bottom:4px;right:9px;width:2px;background:var(--color-border);}
  .t-item{position:relative;padding:0 0 22px 0;}
  .t-item:last-child{padding-bottom:0;}
  .t-dot{position:absolute;right:-26px;top:2px;width:16px;height:16px;border-radius:50%;border:3px solid var(--color-surface);box-shadow:0 0 0 2px var(--type-color,var(--color-primary));background:var(--type-color,var(--color-primary));}
  .t-card{background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:14px 16px;}
  .t-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .t-title{font-weight:800;font-family:'Cairo',sans-serif;font-size:15px;}
  .t-badge{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:var(--radius-full);color:#fff;white-space:nowrap;}
  .t-meta{color:var(--color-muted);font-size:13px;margin-top:6px;}
  .t-countdown{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--color-secondary);}

  /* ===== Groups ===== */
  .group-card{display:flex;flex-direction:column;gap:14px;}
  .group-top{display:flex;align-items:center;gap:14px;}
  .group-avatar{
    width:60px;height:60px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Cairo',sans-serif;font-weight:800;color:#173832;
    border:5px solid var(--belt-color,#ccc);background:#fff;font-size:13px;
  }
  .group-name{margin:0;font-size:16.5px;font-family:'Cairo',sans-serif;}
  .group-sub{margin:2px 0 0;color:var(--color-muted);font-size:13px;}
  .belt-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--color-muted);}
  .belt-swatch{width:12px;height:12px;border-radius:50%;background:var(--belt-color,#ccc);border:1px solid rgba(0,0,0,.08);}
  .group-stats{display:flex;gap:18px;border-top:1px dashed var(--color-border);padding-top:12px;flex-wrap:wrap;}
  .group-stats div{font-size:13px;color:var(--color-muted);}
  .group-stats b{display:block;color:var(--color-text);font-family:'Cairo',sans-serif;font-size:15px;}
  .plan-context{
    background:linear-gradient(90deg, rgba(27,79,145,.07), rgba(193,39,45,.07));
    border:1px dashed var(--color-border);border-radius:var(--radius-md);
    padding:10px 12px;font-size:12.5px;color:var(--color-primary-dark);
  }
  .plan-context b{font-family:'Cairo',sans-serif;}

  /* ===== Forms ===== */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:13px;font-weight:700;color:var(--color-primary-dark);}
  .field input,.field select,.field textarea{
    border:1.5px solid var(--color-border);border-radius:var(--radius-md);
    padding:10px 12px;font-family:inherit;font-size:14px;background:#fbfcfe;color:var(--color-text);
    transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(27,79,145,.15);
  }
  .field textarea{resize:vertical;min-height:70px;}
  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap;}

  /* ===== Sessions list ===== */
  .session-card{border-bottom:1px solid var(--color-border);padding:6px 0;}
  .session-card:last-child{border-bottom:none;}
  .session-entry-card.is-hidden{display:none;}
  .sessions-layout.form-hidden .sessions-list-card{grid-column:1 / -1;}
  .session-row{
    display:flex;align-items:center;gap:16px;padding:10px 6px;
  }
  .session-date{
    width:56px;height:56px;border-radius:16px;flex-shrink:0;
    background:var(--color-bg);border:1px solid var(--color-border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Cairo',sans-serif;color:var(--color-primary-dark);
  }
  .session-date b{font-size:16px;line-height:1;}
  .session-date span{font-size:10.5px;color:var(--color-muted);}
  .session-body{flex:1;min-width:0;}
  .session-title{font-weight:800;font-family:'Cairo',sans-serif;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ai-badge{
    display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;
    color:#fff;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));
    padding:2px 9px;border-radius:var(--radius-full);
  }
  .focus-badge {
    font-size: 10.5px; font-weight: 700;
    color: var(--color-muted);
    border: 1px solid var(--color-border);
    padding: 2px 9px; border-radius: var(--radius-full);
  }
  .session-group-tag{
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    color: var(--color-primary-dark);
  }
  .ai-badge svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2;}
  .session-meta{color:var(--color-muted);font-size:12.5px;margin-top:3px;}
  .stars{display:flex;gap:2px;flex-shrink:0;}
  .stars svg{width:16px;height:16px;}

  .delete-btn {
    width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid var(--color-border);border-radius:12px;background:var(--color-bg);color:var(--color-secondary);
    cursor:pointer;transition:all .2s var(--ease);
  }
  .delete-btn:hover{
    background:rgba(193,39,45,.08);border-color:rgba(193,39,45,.2);transform:translateY(-1px);
  }
  .delete-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

    <a class="nav-btn" href="../index.html" title="العودة إلى إدارة الرياضيين">
      <span class="nav-circle">
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v1"/></svg>
      </span>
      <span class="nav-label">العودة للإدارة</span>
    </a>
    <button class="nav-btn theme-toggle" id="themeToggleBtn" type="button" title="تبديل الوضع الليلي" aria-label="تبديل الوضع الليلي">
      <span class="nav-circle">
        <svg id="themeToggleIcon" viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.7 6.7 0 0 0 21 12.8Z"/></svg>
      </span>
      <span class="nav-label" id="themeToggleLabel">الوضع الليلي</span>
    </button>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="topTitle">لوحة التحكم</h1>
        <p class="sub" id="topSub">نظرة عامة على الموسم الرياضي الحالي</p>
      </div>
      <div class="season-chip"><span class="season-dot"></span> الموسم الرياضي 2025 – 2026</div>
    </header>

    <main id="content">

      <!-- ========================= لوحة التحكم ========================= -->
      <section id="view-dashboard" class="view active">
        <div class="grid stats-grid">
          <div class="card stat-card">
            <span class="stat-icon" style="background:var(--color-primary);">
              <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="8.5" r="2.2"/></svg>
            </span>
            <div>
              <p class="stat-label">مجموعات نشطة</p>
              <p class="stat-value" id="statGroups">—</p>
            </div>
          </div>
          <div class="card stat-card">
            <span class="stat-icon" style="background:var(--color-secondary);">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18"/><path d="M8.5 15l2 2 4.5-4.5"/></svg>
            </span>
            <div>
              <p class="stat-label">حصص هذا الشهر</p>
              <p class="stat-value" id="statSessions">—</p>
            </div>
          </div>
          <div class="card stat-card">
            <span class="stat-icon" style="background:var(--color-gold);">
              <svg viewBox="0 0 24 24"><path d="M6 3v18"/><path d="M6 4h12l-2.5 3.5L18 11H6"/></svg>
            </span>
            <div>
              <p class="stat-label">الهدف القادم</p>
              <p class="stat-value" id="statNextEvent" style="font-size:15px;">—</p>
            </div>
          </div>
          <div class="card stat-card">
            <div class="ring-wrap" style="width:100%;">
              <svg width="58" height="58" viewBox="0 0 58 58" style="flex-shrink:0;">
                <circle cx="29" cy="29" r="24" fill="none" stroke="#E3E8F0" stroke-width="7"/>
                <circle id="progressCircle" cx="29" cy="29" r="24" fill="none" stroke="var(--color-primary)" stroke-width="7" stroke-linecap="round" transform="rotate(-90 29 29)"/>
              </svg>
              <div>
                <p class="ring-value" id="ringValue">0%</p>
                <p class="ring-caption">تقدّم البرنامج الحالي</p>
              </div>
            </div>
          </div>
        </div>

        <div class="grid two-col">
          <div class="card">
            <div class="section-title"><h3>الأهداف القادمة</h3><span style="color:var(--color-muted);font-size:12.5px;">مرتّبة حسب التاريخ</span></div>
            <div class="timeline" id="dashboardTimeline"></div>
          </div>
          <div class="card">
            <div class="section-title"><h3>آخر الحصص المسجَّلة</h3></div>
            <div id="dashboardSessions"></div>
          </div>
        </div>
      </section>

      <!-- ========================= المجموعات ========================= -->
      <section id="view-groups" class="view">
        <div class="view-head">
          <h2>المجموعات</h2>
          <p>المجموعات العمرية للفريق، حسب الخطة السنوية الرسمية، مع المرحلة والتركيز الحالي لكل مجموعة.</p>
        </div>
        <div class="grid stats-grid" id="groupsGrid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));"></div>
      </section>

      <!-- ========================= الأهداف والأحداث ========================= -->
      <section id="view-events" class="view">
        <div class="view-head">
          <h2>الأهداف والأحداث</h2>
          <p>سجّل حدثًا (امتحان أحزمة، بطولة، استعراض...) ليؤخذ بعين الاعتبار عند توليد الحصص التدريبية.</p>
        </div>
        <div class="grid two-col">
          <div class="card">
            <div class="section-title"><h3>إضافة هدف / حدث جديد</h3></div>
            <form id="eventForm" class="form-grid">
              <div class="field full">
                <label>عنوان الحدث</label>
                <input type="text" id="ev-title" placeholder="مثال: امتحان تدرّج الأحزمة – الفصل الأول" required />
              </div>
              <div class="field">
                <label>نوع الحدث</label>
                <select id="ev-type">
                  <option value="beltExam">امتحان تدرّج الأحزمة</option>
                  <option value="wilaya">بطولة ولائية</option>
                  <option value="national">بطولة وطنية</option>
                  <option value="exhibition">استعراض</option>
                  <option value="internal">منافسة داخل القاعة</option>
                </select>
              </div>
              <div class="field">
                <label>المجموعة المستهدفة</label>
                <select id="ev-group"></select>
              </div>
              <div class="field">
                <label>تاريخ الحدث</label>
                <input type="date" id="ev-date" required />
              </div>
              <div class="field full">
                <label>ملاحظات (تُؤخذ بعين الاعتبار عند توليد الحصص)</label>
                <textarea id="ev-notes" placeholder="مثال: التركيز على الكاتا الأولى، وجود طفلين بإصابة خفيفة في الركبة..."></textarea>
              </div>
              <div class="field full form-actions">
                <button type="submit" class="btn btn-primary">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                  حفظ الحدث
                </button>
              </div>
            </form>
          </div>
          <div class="card">
            <div class="section-title"><h3>كل الأهداف المسجَّلة</h3></div>
            <div class="timeline" id="eventsTimeline"></div>
          </div>
        </div>
      </section>

      <!-- ========================= الحصص التدريبية ========================= -->
      <section id="view-sessions" class="view">
        <div class="view-head">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;">
            <h2>سجلّ الحصص التدريبية</h2>
            <button type="button" id="toggleSessionFormBtn" class="btn btn-primary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              إضافة حصة

function setStep(n){
  document.querySelectorAll("#stepper .step").forEach(el=>{
    const s = Number(el.dataset.step);
    el.classList.remove("active","done");
    if(s < n) el.classList.add("done");
    if(s === n) el.classList.add("active");
  });
}

function getRecentGeneratedSessions(groupId, n = 5){
  return state.sessions
    .filter(session => (session.group_id ?? session.groupId) === groupId && (session.ai_generated || session.aiGenerated))
    .sort((a, b) => new Date(b.date) - new Date(a.date))
    .slice(0, n)
    .map(session => ({
      id: session.id,
      date: session.date,
      title: session.title || 'حصة ذكية',
      focus: session.focus_level || 'متوسط',
      exercises: (session.content || '').split('·').map(x => x.trim()).filter(Boolean),
      notes: session.notes_full || ''
    }));
}

function standardizeExercise(exercise){
  const text = (exercise || '').trim();
  const lower = text.toLowerCase();
  const standards = [
    { match: ['إحماء', 'جري وقفز', 'رشاقة'], value: `${text} — مثال معياري: 3 جولات × 45 ثانية (جري أمامي، جانبي، تغيير اتجاه، ثم راحة 30 ثانية). التكييف: أقماع أو خطوط الملعب أو مساحة صغيرة.` },
    { match: ['تنسيق بين اليد والعين', 'مسك وإلقاء', 'أهداف ملونة'], value: `${text} — مثال معياري: 3 جولات × 60 ثانية من الرمي والالتقاط أو لمس الهدف باليدين بالتناوب. التكييف: كرة إسفنجية أو شريك أو أهداف أرضية.` },
    { match: ['توازن', 'الثبات على ساق'], value: `${text} — مثال معياري: 3 × 20 ثانية لكل ساق، ثم تنفيذ لكمة أو استقبال كرة مع الحفاظ على الوضع. التكييف: قرب الرياضي من الحائط أو زد التحدي تدريجيًا.` },
    { match: ['وقفة', 'الوقفات', 'zenkutsu', 'kiba-dachi', 'kokutsu'], value: `${text} — مثال معياري: 3 جولات × 20 ثانية لكل وقفة، ثم 10 انتقالات أمامية مع تثبيت الوضع ثانيتين. التكييف: قلّل العمق أو المسافة حسب المستوى والمساحة.` },
    { match: ['لكم', 'choku-zuki', 'اللكمات'], value: `${text} — مثال معياري: 3 × 10 تكرارات لكل جهة من وضع ثابت، ثم 3 × 20 ثانية بإيقاع مضبوط مع عودة اليد للحراسة. التكييف: هواء أو وسادة أو حبل هدف حسب العتاد.` },
    { match: ['دفاع', 'age-uke', 'soto-uke', 'الدفاعات'], value: `${text} — مثال معياري: 3 × 8 تكرارات لكل جهة ببطء للتصحيح، ثم 3 × 20 ثانية استجابة لإشارة المدرب. التكييف: منفردًا أو مع شريك دون تماس أو باستخدام وسادة.` },
    { match: ['ركلة', 'الركلات', 'mae-geri', 'mawashi-geri', 'yoko-geri'], value: `${text} — مثال معياري: 3 × 6 تكرارات لكل ساق مع رفع الركبة والعودة الآمنة، ثم 2 × 20 ثانية على هدف منخفض. التكييف: خفّض الارتفاع واستعمل دعمًا ثابتًا عند الحاجة.` },
    { match: ['كاتا', 'kata'], value: `${text} — مثال معياري: مروران بطيئان للتقنية، ثم 3 مرات متوسطة الإيقاع مع تصحيح الاتجاه والتنفس، ومرور أخير كامل. التكييف: قسّم الكاتا إلى مقاطع عند ضيق المساحة أو تفاوت المستوى.` },
    { match: ['كوميتيه', 'kumite', 'مباراة', 'المسافة', 'التوقيت'], value: `${text} — مثال معياري: 4 جولات × 60 ثانية (دخول، خروج، دفاع ثم هجوم مضاد) مع 30 ثانية راحة. التكييف: ظل أو شريك دون تماس أو وسادة حسب السلامة والمساحة.` },
    { match: ['لياقة', 'تحمل', 'قوة', 'plyometric', 'hiit'], value: `${text} — مثال معياري: 3 جولات من 30 ثانية عمل و30 ثانية راحة (سكوات، اندفاع، بلانك أو نط خفيف). التكييف: وزن الجسم فقط أو خفّض الشدة والتكرار للرياضيين الأصغر.` },
    { match: ['مرونة'], value: `${text} — مثال معياري: 2 × 30 ثانية لكل وضعية دون ألم، مع تنفس هادئ وعدم الدفع القسري. التكييف: استخدم مدى حركة أصغر أو دعمًا ثابتًا.` },
    { match: ['تحية', 'آداب', 'انضباط'], value: `${text} — مثال معياري: 3 دقائق لتطبيق التحية، الوقوف عند الإشارة، والانطلاق والتوقف الجماعي. التكييف: اجعلها لعبة إشارات للمجموعات الصغيرة أو الكبيرة.` }
  ];
  const standard = standards.find(item => item.match.some(keyword => lower.includes(keyword.toLowerCase())));
  return standard ? standard.value : `${text} — مثال معياري: 3 جولات × 8 إلى 10 تكرارات مع راحة 30 إلى 45 ثانية. التكييف: عدّل التكرار والشدة والمسافة حسب العتاد والرياضيين والمساحة.`;
}

function buildSmartDraftContext(groupId, date, extraNotes, eventId){
  const ctx = getPlanContext(date, groupId);
  const relatedEvent = state.events.map(normalizeEvent).find(ev => ev.id === eventId) || null;
  const feedbackList = getRecentFeedback(groupId, 3);
  const previousGeneratedSessions = getRecentGeneratedSessions(groupId, 5);
  const previousSessions = state.sessions
    .filter(s => (s.group_id || s.groupId) === groupId)
    .sort((a, b) => new Date(b.date) - new Date(a.date))
    .slice(0, 3);
  const recentNotes = state.notes
    .filter(n => n.groupId === groupId)
    .sort((a, b) => new Date(b.date) - new Date(a.date))
    .slice(0, 3);

  const eventTypeBoost = {
    beltExam: [
      "تمارين مراجعة للكاتا الأساسية مع ضبط التوقيت والزوايا.",
      "تكرار الحركات المطلوبة في الاختبار مع تركيز على الاستقرار والهدوء.",
      "تمارين ردود فعل بسيطة تحاكي ظروف الامتحان الحقيقي."
    ],
    wilaya: [
      "تمارين تنافسية قصيرة تحت إشراف مدرب، مع تركيز على التوقيت والمسافة.",
      "مراجعة لكوميتيه القاعة مع تقليل الأخطاء التقنية الأساسية.",
      "تمارين تنسيق واستراتيجية داخل المباراة لتقليل التشتت."
    ],
    national: [
      "تمارين عالية الدقة تحت ضغط زمني معتدل لمواجهة المنافسات الكبرى.",
      "تركيز على الاستمرار والهدوء أثناء التنفيذ في ظروف المنافسة.",
      "مراجعة لأساسيات الأداء مع تحضير نفسي وتركيز على الكاتا."
    ],
    exhibition: [
      "تمارين تنسيق ومزامنة للعرض الجماعي مع التحكم في الإيقاع.",
      "مراجعة الحركات الهادئة والمرحة مع التوازن بين القوة والأناقة.",
      "تدريب على الظهور الثابت والهدوء أمام الجمهور."
    ],
    internal: [
      "تمارين كوميتيه داخل القاعة مع تنويع الهجمات والدفاعات.",
      "إعادة بناء التوقيت الصحيح وقوة التنفيذ في ظروف التدريب الداخلي.",
      "مراجعة مستويات الضغط وملاءمة المسافة مع الشريك."
    ]
  };

  const baseExercises = ctx.block ? [...ctx.block.exercises] : [];
  const tailoredExercises = [...baseExercises];

  if (relatedEvent?.type && eventTypeBoost[relatedEvent.type]) {
    eventTypeBoost[relatedEvent.type].forEach(item => {
      if (!tailoredExercises.includes(item)) tailoredExercises.push(item);
    });
  }

  const summaryText = previousSessions.map(s => (s.content || s.title || 'حصة سابقة').trim()).join(' • ');
  const notesText = recentNotes.map(n => n.text).filter(Boolean).join(' • ');
  const generatedSummaryText = previousGeneratedSessions.length
    ? previousGeneratedSessions.map(s => `${s.title} — ${s.focus} — ${s.exercises.join(' • ') || 'بدون تمرينات محددة'}${s.notes ? ` — ${s.notes}` : ''}`).join(' • ')
    : 'لا توجد حصص ذكية سابقة.';

  if (summaryText.toLowerCase().includes('لياقة') || summaryText.toLowerCase().includes('بدني') || generatedSummaryText.toLowerCase().includes('لياقة') || generatedSummaryText.toLowerCase().includes('بدني')) {
    tailoredExercises.push('تمارين تنفسية وبطء في التنفيذ لتعزيز الاستمرار في الحصة دون الإرهاق.');
  }
  if (summaryText.toLowerCase().includes('كوميتيه') || summaryText.toLowerCase().includes('مباراة') || generatedSummaryText.toLowerCase().includes('كوميتيه') || generatedSummaryText.toLowerCase().includes('مباراة')) {
    tailoredExercises.push('مراجعة المسافة والتوقيت بين الهجوم والدفاع في تمرين قصير وموجه.');
  }
  if (summaryText.toLowerCase().includes('كاتا') || summaryText.toLowerCase().includes('حركات') || generatedSummaryText.toLowerCase().includes('كاتا') || generatedSummaryText.toLowerCase().includes('حركات')) {
    tailoredExercises.push('دمج الحركات الأساسية في تمرين متتالي مع تصحيح زاوية الأداء والتوازن.');
  }
  if (notesText.toLowerCase().includes('ركبة') || notesText.toLowerCase().includes('قدم') || notesText.toLowerCase().includes('عضلات') || generatedSummaryText.toLowerCase().includes('ركبة') || generatedSummaryText.toLowerCase().includes('قدم') || generatedSummaryText.toLowerCase().includes('عضلات')) {
    tailoredExercises.push('تمارين تقوية وتوازن خاص لعضلات الرجلين والركبتين قبل الأداء الرئيسي.');
  }
  if (notesText.toLowerCase().includes('تشتت') || notesText.toLowerCase().includes('تركيز') || notesText.toLowerCase().includes('انضباط') || generatedSummaryText.toLowerCase().includes('تشتت') || generatedSummaryText.toLowerCase().includes('تركيز') || generatedSummaryText.toLowerCase().includes('انضباط')) {
    tailoredExercises.push('تمارين تركيز قصيرة تبني الانضباط وتخفف التشتت خلال تنفيذ الحركات.');
  }

  const dedupedExercises = [...new Set(tailoredExercises.map(standardizeExercise).filter(Boolean))];

  const relatedText = relatedEvent
    ? `الهدف المرتبط: ${relatedEvent.title} — ${fmtDate(relatedEvent.date)} (${relatedEvent.type || 'event'})`
    : 'لا يوجد هدف مرتبط في هذا التاريخ';

  const previousSessionsText = previousSessions.length
    ? previousSessions.map(s => `${s.title || 'حصة تدريبية'} (${fmtDate(s.date)}) — ${s.content || 'بدون محتوى تفصيلي'}`).join('\n')
    : 'لا توجد حصص سابقة مسجلة لهذه المجموعة.';

  const notesSummaryText = recentNotes.length
    ? recentNotes.map(n => `${n.athlete ? n.athlete + ' — ' : ''}${n.text}`).join('\n')
    : 'لا توجد ملاحظات إضافية لهذه المجموعة.';

  const feedbackSummary = feedbackList.length
    ? feedbackList.map(f => `- ${f.text}`).join('\n')
    : 'لا توجد ملاحظات تطبيقية سابقة.';

  const generatedSummary = previousGeneratedSessions.length
    ? `الحصص الذكية السابقة التي يجب مراعاتها: ${generatedSummaryText}`
    : 'لا توجد حصص ذكية سابقة، لذلك يتم بناء الحصة على الخطة السنوية الحالية فقط.';

  const goalLine = relatedEvent
    ? `الهدف الرئيسي للحصة: ${relatedEvent.title} بتاريخ ${fmtDate(relatedEvent.date)} (${EVENT_TYPES[relatedEvent.type]?.label || relatedEvent.type || 'هدف عام'}).${relatedEvent.notes ? ` ملاحظات الهدف: ${relatedEvent.notes}.` : ''}`
    : 'لا يوجد هدف مرتبط في هذا التاريخ، لذلك سيتم بناء الحصة على الخطة السنوية والمستوى الحالي للمجموعة.';

  const phaseLine = `مرحلة التدريب الحالية: ${ctx.phase.title} (${ctx.phase.months}) — الأسبوع ${ctx.week}.`;
  const planLine = `محور الحصة لهذا الأسبوع: ${ctx.block ? ctx.block.title : 'التطوير المستمر للمهارات الأساسية'} — ${ctx.block ? ctx.block.note : 'التركيز على دقة الأداء والاستمرار في التنفيذ.'}`;

  const previousSummary = previousSessions.length
    ? `في الحصص الأخيرة تمت ملاحظة التركيز على: ${previousSessions.map(s => s.content || 'أداء فني متوازن').slice(0, 2).join(' • ')}`
    : 'لا توجد حصص سابقة مسجلة لهذه المجموعة، لذلك تُبنى الحصة على الخطة السنوية فقط.';

  const notesLine = recentNotes.length
    ? `ملاحظات المجموعة: ${recentNotes.map(n => n.text).join(' • ')}`
    : 'لا توجد ملاحظات إضافية للمجموعة في آخر أيام التدريب.';

  const feedbackLine = feedbackList.length
    ? `الملاحظات التطبيقية السابقة: ${feedbackList.map(f => f.text).join(' • ')}`
    : 'لا توجد ملاحظات تطبيقية سابقة لاحتسابها في الخطة الحالية.';

  const coachLine = extraNotes
    ? `ملاحظات المدرب لهذا التاريخ: ${extraNotes}.`
    : 'لا توجد ملاحظات إضافية من المدرب لهذا التاريخ.';

  const coachNote = [
    phaseLine,
    goalLine,
    planLine,
    previousSummary,
    notesLine,
    feedbackLine,
    generatedSummary,
    coachLine,
    'التوجيه التدريبي: إعطاء الأولوية للتنفيذ الدقيق، التحكم في التوقيت، واستقرار الأداء داخل إطار الخطة الحالية، مع ربط الحصة بالهدف المحدد ومراجعة نقاط القوة والضعف من الحصص السابقة والحصص الذكية السابقة.'
  ].join('\n\n');

  return {
    group_id: groupId,
    date,
    phaseTitle: ctx.phase.title,
    blockTitle: ctx.block ? ctx.block.title : 'بدون تصنيف',
    weekLabel: ctx.block ? ctx.block.weeks : '-',
    weekNumber: ctx.week,
    exercises: dedupedExercises,
    coachNote,
    considered: [...feedbackList, ...previousGeneratedSessions.map(s => ({
      id: s.id,
      groupId,
      date: s.date,
      text: `${s.title} — ${s.focus} — ${s.exercises.join(' • ') || 'بدون تمرينات محددة'}${s.notes ? ` — ${s.notes}` : ''}`
    }))],
    relatedEvent
  };
}

    groupId: document.getElementById("no-group").value,
    athlete: document.getElementById("no-athlete").value.trim(),

    date: new Date().toISOString().slice(0,10)
  };
  if(!newNote.text) return;
  state.notes.push(newNote);

});

/* ================== إدارة المستخدمين ================== */
async function renderUsers() {
  // هذه الدالة ستكون فارغة الآن لأننا لا نتعامل مع خادم
  const listEl = document.getElementById('usersList');
  try {
    listEl.innerHTML = state.users.filter(u => u.role !== 'admin').map(user => `
      <div class="user-row">
        <div class="user-info">
          <b style="font-family: 'Cairo', sans-serif;">${user.username}</b>
          <span class="session-group-tag" style="font-size: 10.5px;">${user.role === 'admin' ? 'مدير' : 'مدرب'}</span>
        </div>
        <div class="user-actions" style="display: flex; gap: 4px;">
          <button class="delete-btn change-pass-btn" data-user-id="${user.id}" title="تغيير كلمة المرور"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l-3-3-3 3h2v3H3v-3Z"/><path d="M22 6v3c0 .6-.4 1-1 1h-4v-3h-3v-3h-2l3-3 3 3h-2v3h3v-3Z"/><path d="M12.5 8.5L3 18"/><path d="M21 6l-9.5 9.5"/></svg></button>

/* ================== التهيئة الأولية ================== */
function initDefaults(){
  document.getElementById("ev-date").value = addDays(7);
  document.getElementById("se-date").value = new Date().toISOString().slice(0,10);
  document.getElementById("pg-date").value = new Date().toISOString().slice(0,10);
}
/* ================== المصادقة وتسجيل الدخول ================== */
const appView = document.querySelector('.app');
const usersNavBtn = document.getElementById('usersNavBtn');

async function checkAuth() {
  state.user = null;
  appView.style.opacity = '1';
  usersNavBtn.style.display = 'none';
  renderAll();
}

async function loadEvents(){
  try {
    const response = await fetch('/api/events', { credentials: 'include' });
    if (!response.ok) throw new Error('فشل تحميل الأهداف');
    state.events = (await readJsonResponse(response)).map(normalizeEvent);
  } catch (error) {
    console.error('فشل جلب الأهداف:', error);
  }
}

function updateSessionContextPreview(){
  const groupId = document.getElementById("se-group")?.value || "";
  const date = document.getElementById("se-date")?.value || new Date().toISOString().slice(0,10);
  const ctx = getPlanContext(date, groupId);
  const eventId = document.getElementById("se-event")?.value || "";
  const relatedEvent = state.events.map(normalizeEvent).find(ev => ev.id === eventId);
  const el = document.getElementById("sessionContextPreview");
  if (!el) return;

  el.innerHTML = `
    <span class="ci"><svg viewBox="0 0 24 24"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 4v5h5"/></svg></span>
    <div>
      <b>${ctx.phase.title} (${ctx.phase.months}) — الأسبوع ${ctx.week} من الموسم</b>
      <p>${ctx.block ? ctx.block.title + " — " + ctx.block.note : "لا توجد بيانات لهذه الفئة ضمن الخطة"}</p>
      <small>${relatedEvent ? "الهدف المرتبط: " + relatedEvent.title + " — " + fmtDate(relatedEvent.date) : "لا يوجد هدف محدد"}</small>
    </div>`;
}

async function renderAll(){
  fillGroupSelects();
  initDefaults();
  await loadEvents();
  renderGroups();
  renderSessions();
  renderDashboard();
  renderEvents();
  renderNotes();
  updateContextPreview();
  updateSessionContextPreview();
  setupGroupFilter();
}

function setupGroupFilter() {
  const filterContainer = document.getElementById('sessionGroupFilter');
  // إضافة الأزرار الديناميكية للمجموعات
  state.groups.forEach(group => {
    const button = document.createElement('button');
    button.className = 'pill';
    button.dataset.groupId = group.id;
    button.textContent = group.name;
    filterContainer.appendChild(button);
  });

  // إضافة مستمع حدث واحد للحاوية بأكملها (Event Delegation)
  filterContainer.addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON') {
      filterContainer.querySelector('.active').classList.remove('active');
      e.target.classList.add('active');
      renderSessions();
    }
  });
}

document.getElementById("se-group").addEventListener("change", function(){
  fillEventSelectForGroup();
  updateSessionContextPreview();
});
document.getElementById("se-date").addEventListener("change", updateSessionContextPreview);
document.getElementById("se-event").addEventListener("change", updateSessionContextPreview);


// دالة مركزية للتعامل مع أخطاء API وعرضها للمستخدم (مبسطة الآن)
function handleApiError(error, errorElement) {
    const message = error.message || 'حدث خطأ غير متوقع.';
    console.error('API Error:', error);
    if (errorElement) {
        errorElement.textContent = message;
        errorElement.style.display = 'block';
    } else {
        alert(message);
    }
}

// بدء التطبيق بالتحقق من حالة تسجيل الدخول
checkAuth();
</script>

function addDays(n){
  const d = new Date();
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}
function fmtDate(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("ar-DZ", { day:"2-digit", month:"long", year:"numeric" });
}
function daysUntil(iso){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(iso + "T00:00:00");
  return Math.round((target - today) / 86400000);
}
function groupName(id){
  const g = state.groups.find(g => g.id === id);
  return g ? g.name : "—";
}
function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }

/* ================== منطق الخطة السنوية ================== */
// TODO (AI): هذه الدالة تحسب "أين نحن الآن" في الخطة السنوية بناءً على التاريخ.
// عند الربط بذكاء اصطناعي حقيقي، تُرسَل هذه المعلومات + الملاحظات كسياق (context) للنموذج.
function getPlanContext(dateISO, groupId){
  const start = new Date(state.seasonStart + "T00:00:00");
  const d = new Date((dateISO || new Date().toISOString().slice(0,10)) + "T00:00:00");
  let diffDays = Math.round((d - start) / 86400000);
  let week = Math.floor(diffDays / 7) + 1;
  if (week < 1) week = 1;
  if (week > 48) week = 48;
  const phaseIndex = Math.min(3, Math.floor((week - 1) / 12));
  const weekInPhase = week - phaseIndex * 12;
  const blockIndex = Math.min(2, Math.floor((weekInPhase - 1) / 4));
  const phase = ANNUAL_PLAN[phaseIndex];
  const groupKey = GROUP_PLAN_KEY[groupId];
  const groupPlan = groupKey ? phase.groups[groupKey] : null;
  const block = groupPlan ? groupPlan.blocks[blockIndex] : null;
  return { week, phase, groupPlan, block };
}
function getRecentFeedback(groupId, n){
  return state.feedback.filter(f => f.groupId === groupId)
    .sort((a,b)=> new Date(b.date) - new Date(a.date)).slice(0, n || 3);
}

function renderDashboard(){
  // تحديث رسالة الترحيب في الشريط العلوي
  if (state.user && state.user.username) {
    document.getElementById("topTitle").textContent = `مرحبًا، ${state.user.username}`;
    document.getElementById("topSub").textContent = "نظرة عامة على الموسم الرياضي الحالي";
  }

  document.getElementById("statGroups").textContent = state.groups.length;

  const thisMonth = new Date().getMonth();
  const sessionsThisMonth = state.sessions.filter(s => new Date(s.date).getMonth() === thisMonth).length;
  document.getElementById("statSessions").textContent = sessionsThisMonth;

  const upcoming = [...state.events].filter(e=>daysUntil(e.date)>=0).sort((a,b)=> new Date(a.date)-new Date(b.date));
  document.getElementById("statNextEvent").textContent = upcoming[0] ? upcoming[0].title : "لا يوجد";

  const pct = upcoming[0] ? Math.min(100, Math.max(6, 100 - daysUntil(upcoming[0].date))) : 40;
  const circle = document.getElementById("progressCircle");
  const r = 24, c = 2*Math.PI*r;
  circle.style.strokeDasharray = c;
  circle.style.strokeDashoffset = c;
  circle.style.transition = "stroke-dashoffset 1s var(--ease)";
  requestAnimationFrame(()=>{ circle.style.strokeDashoffset = c - (pct/100)*c; });
  document.getElementById("ringValue").textContent = pct + "%";

  const timeline = document.getElementById("dashboardTimeline");
  timeline.innerHTML = upcoming.length ? upcoming.slice(0,4).map(eventTimelineItem).join("") : emptyState("لا توجد أهداف قادمة حاليًا");

  const recentSessions = [...state.sessions].sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,4);
  document.getElementById("dashboardSessions").innerHTML = recentSessions.length ? recentSessions.map(s=>sessionRow(s,false)).join("") : emptyState("لا توجد حصص مسجَّلة بعد");
}

  const focusBadge = s.focus_level ? `<span class="focus-badge">تركيز ${s.focus_level}</span>` : "";

    ratingDisplay = `
      <select class="rate-select" data-session="${s.id}">
        <option value="">بانتظار التقييم</option>

      </select>`;
  } else {
    ratingDisplay = `<span style="font-size:11.5px;color:var(--color-muted);font-weight:700;">بانتظار التقييم</span>`;
  }
  const deleteButton = withFeedback ? `
    <button class="delete-btn" data-session-id="${s.id}" title="حذف الحصة">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
    </button>
  ` : "";

  // بناء قائمة التمارين
  const exercisesList = s.content ? `<ul>${s.content.split('·').map(ex => `<li>${ex.trim()}</li>`).join('')}</ul>` : '<p>غير محدد</p>';
  const coachNotes = s.notes_full ? `<h4>ملاحظات المدرب</h4><p>${s.notes_full}</p>` : '';

  const summaryRow = `
    <summary class="session-row">
        <div class="session-date"><b>${day}</b><span>${month}</span></div>

            <div class="session-title">
            <span>${titleText}</span>

            ${aiBadge}
            </div>
            <div class="session-meta">${s.duration} دقيقة · ${s.content}</div>
        </div>
        ${ratingDisplay}
        ${deleteButton}

    <div class="session-details-content">
        <h4>تمارين الحصة</h4>
        ${exercisesList}
        ${coachNotes}
    </div>`;

  // إذا كانت الصفحة هي لوحة التحكم، نعرض الصف فقط بدون تفاصيل
  if(!withFeedback) {
      return `<div class="session-card"><div class="session-row">${summaryRow.replace(/<summary|<\/summary>/g, 'div')}</div></div>`;
  }

  const fbList = state.feedback.filter(f=>f.sessionId===s.id);
  const fbHtml = fbList.length ? fbList.map(f=>`<div class="feedback-item">${f.text}<span>${fmtDate(f.date)}</span></div>`).join("") : `<p style="font-size:12.5px;color:var(--color-muted);margin:6px 0;">لا توجد ملاحظات تطبيقية بعد لهذه الحصة.</p>`;
  return `
    <div class="session-card">
      <details class="session-details">
        ${summaryRow}
        ${detailsContent}
      </details>
      <details class="feedback-block">
        <summary>ملاحظات تطبيقية (${fbList.length})</summary>
        ${fbHtml}
        <form class="feedback-form" data-session="${s.id}" data-group="${s.groupId}">
          <textarea placeholder="ما الذي نجح؟ وما الذي يجب التركيز عليه في الحصة القادمة؟" required></textarea>
          <button class="btn btn-ghost btn-sm" type="submit">حفظ الملاحظة</button>
        </form>
      </details>
    </div>`;
}
function starRow(rating){
  let stars = "";
  for(let i=1;i<=5;i++){
    stars += `<svg viewBox="0 0 24 24" fill="${i<=rating ? 'var(--color-gold)':'none'}" stroke="var(--color-gold)" stroke-width="1.6"><path d="M12 2l2.9 6 6.6.9-4.8 4.6 1.1 6.6L12 17l-5.8 3.1 1.1-6.6-4.8-4.6 6.6-.9L12 2z"/></svg>`;
  }
  return `<div class="stars">${stars}</div>`;
}
function emptyState(msg){
  return `<div class="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8 15c1.2 1.2 2.6 1.8 4 1.8s2.8-.6 4-1.8"/></svg>

    });

  } catch (error) {
    console.error("فشل في جلب بيانات المجموعات:", error);
    grid.innerHTML = `<div class="card"><p style="color:var(--color-secondary);">حدث خطأ أثناء تحميل بيانات المجموعات.</p></div>`;

  grid.innerHTML = state.groups.map(g=>{

    const ctx = getPlanContext(todayISO, g.id);
    return `

          <div class="group-avatar" style="--belt-color:${beltColor}">${g.athletes_count}</div>
          <div>
            <p class="group-name">${g.name}</p>
            <p class="group-sub">${g.ageRange}</p>
            <span class="belt-chip"><span class="belt-swatch" style="--belt-color:${beltColor}"></span>الحزام السائد: ${BELT_LABELS[g.belt]}</span>
          </div>
        </div>
        <div class="group-stats">
          <div>عدد الأطفال<b>${g.athletes_count}</b></div>
          <div>حصص مسجَّلة<b>${sessionsCount}</b></div>
          <div>الهدف القادم<b style="font-size:12.5px;">${nextEvent ? nextEvent.title : "لا يوجد"}</b></div>
        </div>
        <div class="plan-context">
          <b>المرحلة الحالية (الخطة السنوية):</b> ${ctx.phase.title} — ${ctx.block ? ctx.block.title : ""} (الأسبوع ${ctx.week})

    el.classList.remove("active","done");

}

/* ================== المصادقة وتسجيل الدخول ================== */
const loginView = document.getElementById('login-view');
const appView = document.querySelector('.app');
const usersNavBtn = document.getElementById('usersNavBtn');

async function checkAuth() {
    try {
        const response = await fetch('/api/check-auth', {
            credentials: 'include' // مهم جدًا لإرسال الكوكيز الخاصة بالجلسة
        });
        const authData = await response.json();
        if (authData.isAuthenticated) {
            state.user = authData.user; // حفظ بيانات المستخدم في الحالة العامة
            loginView.classList.add('hidden');
            appView.style.opacity = '1';
            // إظهار زر إدارة المستخدمين إذا كان المستخدم مديرًا
            if (authData.user && authData.user.role === 'admin') {
                usersNavBtn.style.display = 'flex';
            } else {
                usersNavBtn.style.display = 'none';
            }
            appView.style.opacity = '1';
            renderAll(); // بدء تحميل وعرض كل شيء بعد التأكد من تسجيل الدخول
        } else {
            loginView.classList.remove('hidden');
            appView.style.opacity = '0';
        }
    } catch (error) {
        state.user = null;
        console.error('خطأ في التحقق من المصادقة:', error);
        loginView.classList.remove('hidden');
        appView.style.opacity = '0';
    }
}

    const username = e.target.username.value;
    const password = e.target.password.value;
    const errorEl = document.getElementById('login-error');
    errorEl.style.display = 'none';

    try {
        const response = await fetch('/api/login', {
            credentials: 'include', // مهم جدًا لإرسال الكوكيز الخاصة بالجلسة
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message);
        
        await checkAuth(); // تحقق مرة أخرى لإظهار التطبيق
    } catch (error) {
        handleApiError(error, errorEl);
        e.target.password.value = ''; // مسح حقل كلمة المرور عند الخطأ
    }
});

function handleApiError(error, errorElement) {
    let message;

    if (error.message === 'Failed to fetch') {
        message = 'فشل الاتصال بالخادم. يرجى التأكد من أن الخادم يعمل وأنك متصل بالشبكة.';
    } else if (error instanceof SyntaxError) {
        // هذا الخطأ يحدث عندما تكون الاستجابة فارغة أو ليست بصيغة JSON صالحة
        message = 'حدث خطأ في الاستجابة من الخادم. الرجاء المحاولة مرة أخرى.';
    } else if (error.message) {
        // هذه هي الرسائل المخصصة التي نرسلها من الخادم
        message = error.message;
    } else {
        message = 'حدث خطأ غير متوقع. الرجاء المحاولة مرة أخرى.';
    }

    console.error('API Error:', error); // للاحتفاظ بالتفاصيل التقنية في الكونسول للمطور

    if (errorElement) {
        errorElement.textContent = message;
        errorElement.style.display = 'block';
    } else {
        // في حال عدم وجود عنصر مخصص، يمكننا عرض تنبيه عام
        alert(message);
    }
}
